name: CI

# ──────────────────────────────────────────────────────────
# Gate jobs (REQUIRED — block merging / signal bad deploy) — 7 gates:
#   client-tests   — Vitest unit + hook suite                  (added in audit PR 9)
#   client-build   — vite production build must compile clean
#   client-lint    — eslint with ratchet cap (promoted to REQUIRED in audit
#                    PR J — CODE-007). Current cap lives in
#                    `client/package.json` (`npm run lint`); ratchet history
#                    + downgraded-rule rationale live in
#                    `client/eslint.config.js`. Lower the cap as warnings
#                    are resolved, never raise it.
#   secrets-scan   — gitleaks scan; fails if any secret pattern matches
#                    (added in audit PR 1 — SEC-001 prevention)
#   audit          — npm audit at high+ level (production deps only on
#                    the server; full deps on the client). Promoted from
#                    informational to REQUIRED in audit PR 2 — SEC-002.
#   e2e-tests      — Playwright spec suite against a real (seeded) backend on a
#                    Postgres service (audit PR V — P2-09; moved to PG in Wave K
#                    Phase 2 Batch B). Catches regressions that unit tests alone
#                    can't (full auth + permission + UI flows). Slowest gate.
#   server-tests-pg — the FULL Jest suite on the Postgres backend
#                    (DB_BACKEND=postgres) — the SOLE server-test gate since the
#                    Mongo `server-tests` lane was retired (Wave K Phase 2 Batch
#                    C, 2026-07-10; prod runs PG, Atlas cancelled). Promoted to
#                    REQUIRED (Wave G, 2026-07-07), zero exclusions. NOTE: the
#                    Jest harness still spins up mongodb-memory-server to AUTHOR
#                    fixtures (via tests/pg-auto-mirror); dropping mongoose
#                    entirely needs the fixture-layer decouple — the remaining
#                    Wave K work (Batch D).
# ──────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new commit hits the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # GATE #8 (Wave G, 2026-07-07): the FULL server suite on Postgres
  # Runs the entire Jest suite with DB_BACKEND=postgres against the same
  # postgres:16 service — phase G of the Mongo→Postgres master plan. Was the
  # informational divergence-INVENTORY lane (`continue-on-error: true`) during
  # bring-up; PROMOTED to a REQUIRED gate once the GATED schedule
  # roster-sync/waitlist cluster closed (Slices 0/A/B+C/D/E). Both lanes must
  # now stay green through the Phase-5 cutover — a PG divergence blocks merge.
  # Wave-F PR-2 (attendance-export dual-backend port) closed `p2-regression` on
  # 2026-07-07 and the temporary exclusion was dropped — the gate covers the
  # WHOLE suite with zero exclusions.
  # ──────────────────────────────────────────────────────────
  server-tests-pg:
    name: Server tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tmsci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PG_URL: postgresql://ci:ci@localhost:5432/tmsci

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund --no-progress

      - name: Apply PG migrations
        working-directory: server
        run: npx knex migrate:latest --knexfile db/pg/knexfile.js

      - name: Run Jest test suite on the Postgres backend
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-used-for-anything-real
          SENTRY_DSN: ''
          NODE_OPTIONS: --max-old-space-size=8192
          DB_BACKEND: postgres

  # ──────────────────────────────────────────────────────────
  # GATE: client unit + hook tests (Vitest)
  # Added in audit PR 9 (QA-001). Previously only the build was gated,
  # so client logic regressions could land on main undetected.
  # ──────────────────────────────────────────────────────────
  client-tests:
    name: Client tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 22 across all jobs (audit round 7) — the 20 here was an
          # accident of history, not a decision.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Run Vitest
        working-directory: client
        run: npm run test:run

  # ──────────────────────────────────────────────────────────
  # GATE: client build must compile
  # ──────────────────────────────────────────────────────────
  client-build:
    name: Client build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Build (vite)
        working-directory: client
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # GATE: client lint (REQUIRED — promoted in audit PR J)
  # The `lint` script runs eslint with `--max-warnings 81`, the
  # ratchet cap reflecting the warning count on main at promotion
  # time. PR that pushes the count above the cap fails CI; PRs
  # that lower it should also lower the cap in the same commit.
  # ──────────────────────────────────────────────────────────
  client-lint:
    name: Client lint (eslint, ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Lint
        working-directory: client
        run: npm run lint

  # ──────────────────────────────────────────────────────────
  # GATE: npm audit (REQUIRED — promoted from informational in audit
  # PR 2 once critical + high advisories were resolved).
  #
  # Server step uses --omit=dev so test-only advisories (e.g. jest /
  # supertest) don't gate production deploys.
  # ──────────────────────────────────────────────────────────
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Audit server (high+, production deps only)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Audit client (high+)
        working-directory: client
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────────────────
  # GATE: secret scan (blocks if any credential pattern matches)
  # Added in audit PR 1 — SEC-001 prevention.
  # ──────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action posts a PR comment + uploads artifact + writes a job
    # summary. The default GITHUB_TOKEN only has contents:read, so the action
    # 403'd with "Resource not accessible by integration". Grant the minimum
    # extra perms it needs.
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for accurate scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not set — using free OSS edition (sufficient for our scope)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Fail if server/.env was committed
        # Belt and braces: gitleaks should catch this, but assert directly.
        run: |
          if git ls-files --error-unmatch server/.env 2>/dev/null; then
            echo "::error::server/.env is tracked by git. Add it to .gitignore and remove from history."
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git."
            exit 1
          fi
          echo "OK: no .env files tracked."

      - name: Fail if HR/L&D source data is reachable
        run: |
          npm run data-safety:test
          npm run data-safety:check

  # ──────────────────────────────────────────────────────────
  # GATE: Playwright E2E (audit PR V / P2-09 — REQUIRED since PR X)
  #
  # Boots the real backend against a Postgres service (DB_BACKEND=postgres),
  # applies the knex migrations, seeds the canonical test users
  # (000001/000004) via the PG-native seed, then runs the Playwright specs in
  # client/e2e/. Catches regressions in the full auth → role guard → UI flow
  # that Vitest unit tests can't see.
  #
  # Audit PR X (P2-09 follow-up): specs rewritten for the IA-S2/S3
  # routes (/people, /programs, /calendar, /system) and the i18n'd
  # copy emitted by react-i18next. playwright.config.js now pins
  # `use.locale = 'en-US'` so the LanguageDetector falls back to
  # English in CI and the spec selectors match a stable string set.
  # With that in place, `continue-on-error` was removed and this gate
  # is back to REQUIRED status.
  #
  # Postgres, not Mongo (Wave K Phase 2, Batch B): prod runs on PG and the
  # Mongo path is being retired. This gate mirrors the server-tests-pg job's
  # postgres:16 service + `knex migrate:latest`, then seeds with the PG-native
  # scripts/seed-pg.js (Batch A). No replica set needed — the booking/soft-delete
  # transactions run natively on Postgres.
  #
  # Failure artifacts:
  #   playwright-report/   uploaded on failure for debugging.
  #   server.log           uploaded on failure so a crash is visible
  #                        without re-running the workflow locally.
  # ──────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tmsci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PG_URL: postgresql://ci:ci@localhost:5432/tmsci

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        # CODE-014: npm ci installs the committed lockfile verbatim; if a dep
        # bump desyncs package.json↔lockfile, regen the lockfile in the same PR.
        run: npm ci --no-audit --no-fund --no-progress

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Apply PG migrations
        working-directory: server
        run: npx knex migrate:latest --knexfile db/pg/knexfile.js

      - name: Seed database (PG-native)
        working-directory: server
        env:
          DB_BACKEND: postgres
          NODE_ENV: test
        run: npm run seed

      - name: Clear mustChangePassword on seed users
        # Seed admin (000001) is normally created with mustChangePassword=true
        # so the first real login forces a password change — but in E2E that
        # modal (z-9999, click-event eating overlay) blocks every test. Flip
        # it off for the seeded users before Playwright starts.
        working-directory: server
        run: |
          node -e "
          (async () => {
            const { Pool } = require('pg');
            const pool = new Pool({ connectionString: process.env.PG_URL });
            const r = await pool.query('UPDATE users SET must_change_password = false');
            console.log('Cleared mustChangePassword on', r.rowCount, 'users');
            await pool.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Start API server in background
        working-directory: server
        env:
          DB_BACKEND: postgres
          JWT_SECRET: e2e-test-secret-not-used-anywhere-real
          CRON_TOKEN: e2e-test-cron-token-not-used-anywhere-real-1234
          IMPORT_DEFAULT_PASSWORD: e2e-import-default-12345
          PORT: 5000
          NODE_ENV: development
          # pino defaults to silent when NODE_ENV=test; force info so we
          # see the PG connection + Express listen events in server.log.
          LOG_LEVEL: info
          # SEC-006 server.js rejects no-origin in production; tests use
          # supertest-style requests via Playwright that DO send Origin,
          # but the bypass keeps us safe if NODE_ENV ever flips.
          CORS_BYPASS_NO_ORIGIN: 'true'
          # QA-018 (PR #59): the whole Playwright suite shares one runner IP;
          # its aggregate traffic trips globalLimiter (200 req/min) and the
          # next spec's login 429s. Limiter wiring has its own dedicated gate
          # (rateLimiterWiring.test.js); e2e prefers determinism. The flag is
          # ignored when NODE_ENV=production.
          DISABLE_RATE_LIMITS: 'true'
          # Disable Sentry — no DSN, no noise.
          SENTRY_DSN: ''
        # Disable bash -e so a missing server.log (race) doesn't pre-empt
        # the diagnostic tail at the end.
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          touch server.log
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          # PG service is health-gated before the job starts and migrations +
          # seed already ran, so boot is fast — but keep the 60s ceiling for
          # Express-boot headroom.
          for i in $(seq 1 60); do
            if curl -fs http://localhost:5000/health > /dev/null; then
              echo "Server ready after ${i}s"
              echo "── server.log (first ${i}s) ──"
              sed -n '1,40p' server.log || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become ready within 60s"
          echo "── server.log (full) ──"
          cat server.log || echo "(no server.log)"
          exit 1

      - name: Run Playwright E2E suite
        working-directory: client
        env:
          CI: '1'
        run: npm run test:e2e

      - name: Stop API server
        if: always()
        working-directory: server
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
            rm -f server.pid
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: server/server.log
          retention-days: 7
