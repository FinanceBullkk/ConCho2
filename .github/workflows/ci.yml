name: CI

# ──────────────────────────────────────────────────────────
# Gate jobs (REQUIRED — block merging / signal bad deploy):
#   server-tests   — Jest suite with mongodb-memory-server
#   client-tests   — Vitest unit + hook suite                  (added in audit PR 9)
#   client-build   — vite production build must compile clean
#
# Informational jobs (NON-BLOCKING — report only):
#   client-lint    — surface new lint errors without failing CI
#                    (codebase has ~30 pre-existing issues; clean up
#                    via a dedicated PR, don't block unrelated work)
#   audit          — npm audit at high+ level for both packages
#                    (PR 1/2 will promote to REQUIRED once landed.)
# ──────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new commit hits the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # GATE: server tests
  # ──────────────────────────────────────────────────────────
  server-tests:
    name: Server tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest test suite
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          # JWT_SECRET is required at boot — provide a dummy for tests
          JWT_SECRET: ci-test-secret-not-used-for-anything-real
          # Disable Sentry in CI so we don't pollute the dashboard
          SENTRY_DSN: ''

  # ──────────────────────────────────────────────────────────
  # GATE: client unit + hook tests (Vitest)
  # Added in audit PR 9 (QA-001). Previously only the build was gated,
  # so client logic regressions could land on main undetected.
  # ──────────────────────────────────────────────────────────
  client-tests:
    name: Client tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Run Vitest
        working-directory: client
        run: npm run test:run

  # ──────────────────────────────────────────────────────────
  # GATE: client build must compile
  # ──────────────────────────────────────────────────────────
  client-build:
    name: Client build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Build (vite)
        working-directory: client
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # INFO: lint (non-blocking)
  # ──────────────────────────────────────────────────────────
  client-lint:
    name: Client lint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Lint
        working-directory: client
        run: npm run lint

  # ──────────────────────────────────────────────────────────
  # INFO: npm audit (non-blocking until PR 2 lands).
  # Server step uses --omit=dev so test-only advisories don't gate.
  # ──────────────────────────────────────────────────────────
  audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit server (high+, prod-only)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Audit client (high+)
        working-directory: client
        run: npm audit --audit-level=high
